<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krankmeldung – Sprache auswählen</title>

  <style>
    :root {
      --red: #AE0F0A;
      --yellow: #FDC400;
      --plum: #370B28;

      --background: #fffaf8;
      --card: #ffffff;
      --soft-red: #fff2f1;
      --soft-yellow: #fff9df;
      --soft-plum: #f7f1f5;

      --text: #2f2830;
      --muted: #716870;
      --border: #eadfe5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #fff4ef 0, transparent 35%),
        radial-gradient(circle at bottom right, #fff8d9 0, transparent 30%),
        var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 28px 16px 45px;
    }

    .main-card {
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 30px 22px 26px;
      box-shadow: 0 10px 35px rgba(55, 11, 40, 0.09);
    }

    .logo {
      display: block;
      width: min(300px, 80%);
      height: auto;
      margin: 0 auto 25px;
    }

    .icon-circle {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--soft-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--plum);
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.15;
    }

    .intro {
      text-align: center;
      margin: 14px auto 27px;
      max-width: 480px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .language-list {
      display: grid;
      gap: 13px;
    }

    .language {
      display: flex;
      align-items: center;
      min-height: 68px;
      padding: 13px 16px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--plum);
      font-weight: 700;
      font-size: 19px;
      background: white;
      border: 1px solid var(--border);
      box-shadow: 0 3px 10px rgba(55, 11, 40, 0.04);
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .language:nth-child(3n+1) {
      background: var(--soft-red);
    }

    .language:nth-child(3n+2) {
      background: var(--soft-yellow);
    }

    .language:nth-child(3n+3) {
      background: var(--soft-plum);
    }

    .language:hover,
    .language:focus {
      transform: translateY(-2px);
      border-color: var(--red);
      box-shadow: 0 7px 18px rgba(55, 11, 40, 0.09);
    }

    .flag {
      font-size: 30px;
      width: 48px;
      flex-shrink: 0;
      text-align: center;
      margin-right: 10px;
    }

    .language-name {
      flex: 1;
    }

    .arrow {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red);
      font-size: 26px;
      line-height: 1;
      margin-left: 10px;
      box-shadow: 0 2px 7px rgba(55, 11, 40, 0.08);
    }

    .info {
      margin-top: 24px;
      padding: 17px 18px;
      border-radius: 18px;
      background: var(--soft-yellow);
      border-left: 5px solid var(--yellow);
      color: #5d5148;
      font-size: 14px;
      line-height: 1.55;
    }

    .info strong {
      color: var(--plum);
    }

    .footer {
      text-align: center;
      margin-top: 23px;
      color: #90858e;
      font-size: 12px;
    }

    .decorative-line {
      width: 90px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--red) 0 38%,
        var(--yellow) 38% 67%,
        var(--plum) 67% 100%
      );
      margin: 20px auto 0;
    }

    @media (max-width: 480px) {
      .page {
        padding: 14px 10px 30px;
      }

      .main-card {
        padding: 24px 14px 22px;
        border-radius: 23px;
      }

      .logo {
        width: min(260px, 85%);
        margin-bottom: 20px;
      }

      .intro {
        font-size: 16px;
      }

      .language {
        min-height: 64px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="main-card">

      <img
        class="logo"
        src="logo.png"
        alt="Kläger Group"
      >

      <div class="icon-circle">🌍</div>

      <h1>Krankmeldung</h1>

      <div class="decorative-line"></div>

      <p class="intro">
        Bitte wähle deine Sprache.<br>
        Please choose your language.
      </p>

      <div class="language-list">

        <a class="language" href="Deutsch.png">
          <span class="flag">🇩🇪</span>
          <span class="language-name">Deutsch</span>
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Englisch.png">
          <span class="flag">🇬🇧</span>
          <span class="language-name">English</span>
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Türkisch.png">
          <span class="flag">🇹🇷</span>
          <span class="language-name">Türkçe</span>
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Kroatisch.png">
          <span class="flag">🇭🇷</span>
          <span class="language-name">Hrvatski</span>
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Italienisch.png">
          <span class="flag">🇮🇹</span>
          <span class="language-name">Italiano</span>
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Russisch.png">
          <span class="flag">🇷🇺</span>
          <span class="language-name">Русский</span>
          <span class="arrow">›</span>
        </a>

      </div>

      <div class="info">
        <strong>Hinweis:</strong>
        Tippe auf deine Sprache, um die Anleitung zur Krankmeldung zu öffnen.
      </div>

      <div class="footer">
        Kläger Group
      </div>

    </section>

  </main>

</body>
</html>
