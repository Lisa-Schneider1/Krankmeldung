<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krankmeldung – Sprache auswählen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fb;
      color: #17324d;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 30px;
    }

    .subtitle {
      font-size: 18px;
      color: #5b6770;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .languages {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .language {
      display: flex;
      align-items: center;
      text-decoration: none;
      background: #ffffff;
      border: 2px solid #d9e2e8;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 20px;
      font-weight: bold;
      color: #17324d;
      transition: 0.2s;
    }

    .language:hover,
    .language:active {
      background: #eef5f8;
      border-color: #7aa7bd;
      transform: scale(1.01);
    }

    .flag {
      font-size: 30px;
      margin-right: 16px;
      width: 42px;
      text-align: center;
    }

    .arrow {
      margin-left: auto;
      font-size: 24px;
      color: #6c8796;
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      color: #78838c;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .container {
        padding: 18px 12px 35px;
      }

      .card {
        padding: 25px 16px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 17px;
      }

      .language {
        font-size: 19px;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>🌍 Krankmeldung</h1>

      <div class="subtitle">
        Bitte wähle deine Sprache.<br>
        Please choose your language.
      </div>

      <div class="languages">

        <a class="language" href="Deutsch.png">
          <span class="flag">🇩🇪</span>
          Deutsch
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Englisch.png">
          <span class="flag">🇬🇧</span>
          English
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Türkisch.png">
          <span class="flag">🇹🇷</span>
          Türkçe
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Kroatisch.png">
          <span class="flag">🇭🇷</span>
          Hrvatski
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Italienisch.png">
          <span class="flag">🇮🇹</span>
          Italiano
          <span class="arrow">›</span>
        </a>

        <a class="language" href="Russisch.png">
          <span class="flag">🇷🇺</span>
          Русский
          <span class="arrow">›</span>
        </a>

      </div>

      <div class="footer">
        Tippe auf deine Sprache, um die Anleitung zur Krankmeldung zu öffnen.
      </div>

    </div>

  </div>

</body>
</html>
